{extend name="__PLUGIN_VIEW__/base"}
{block name="title"}分组管理{/block}
{block name="content"}
<div class="app-main container-fluid">
    {include file="__PLUGIN_VIEW__/index_header" icon="bi bi-folder" caption="分组管理" buttongroup="<button class='btn btn-primary btn-sm' onclick='handleAdd()'><i class='bi bi-plus-lg'></i> 新增分组</button>" /}
    <div class="plugin-shortlink">
        <div class="container-fluid p-0">
            <!-- 搜索栏 -->
            <div class="search-bar mb-3">
                <div class="row g-2">
                    <div class="col-md-3">
                        <input type="text" class="form-control form-control-sm" id="search-keyword" placeholder="分组名称/标识">
                    </div>
                    <div class="col-md-2">
                        <button class="btn btn-outline-secondary btn-sm" onclick="handleSearch()">
                            <i class="bi bi-search"></i> 搜索
                        </button>
                    </div>
                </div>
            </div>

            <!-- 数据表格 -->
            <table id="data-table"
                   data-toggle="table"
                   data-url="{:url('/plugin/shortlink/group/getList')}"
                   data-side-pagination="server"
                   data-pagination="true"
                   data-page-list="[10, 25, 50, 100]"
                   data-page-size="20"
                   data-id-field="id"
                   data-toolbar="#toolbar"
                   data-query-params="queryParams">
                <thead>
                    <tr>
                        <th data-field="id" data-width="60" data-align="center">ID</th>
                        <th data-field="name" data-width="160">分组名称</th>
                        <th data-field="ident" data-width="140">标识</th>
                        <th data-field="description" data-width="220">描述</th>
                        <th data-field="sort_order" data-width="80" data-align="center">排序</th>
                        <th data-field="status" data-width="70" data-align="center">状态</th>
                        <th data-field="operate" data-width="150" data-align="center" data-formatter="operateFormatter" data-events="operateEvents">操作</th>
                    </tr>
                </thead>
            </table>
        </div>
    </div>
</div>

<!-- 分组编辑弹窗 -->
<div class="modal fade" id="group-modal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">编辑分组</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="group-form">
                    <input type="hidden" name="id" value="0">
                    <div class="mb-3">
                        <label class="form-label">分组名称 <span class="text-danger">*</span></label>
                        <input type="text" name="name" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">标识</label>
                        <input type="text" name="ident" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">描述</label>
                        <textarea name="description" class="form-control" rows="3"></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">排序</label>
                        <input type="number" name="sort_order" class="form-control" value="0">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">状态</label>
                        <select name="status" class="form-select">
                            <option value="1">启用</option>
                            <option value="0">禁用</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" onclick="submitGroup()">保存</button>
            </div>
        </div>
    </div>
</div>
{/block}
{block name="js"}
<script type="module">
import api from '/statics/plugins/shortlink/js/common/api.js';
import module from '/statics/plugins/shortlink/js/group/index.js';

        $(function() {
            module.index();
        });
</script>
{/block}
