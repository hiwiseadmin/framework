<script src="__JS__/jquery.min.js"></script>
<script src="__JS__/bootstrap.bundle.min.js"></script>
<script>
$(function() {
    $('#order-form').submit(function(e) {
        e.preventDefault();

        var $btn = $('#submit-btn');
        $btn.prop('disabled', true).text('保存中...');

        $.post('<?php echo plugin_url("workflowdemo/order/save"); ?>', $(this).serialize(), function(res) {
            if (res.code === 1) {
                alert('保存成功');
                location.href = '<?php echo plugin_url("workflowdemo/order/index"); ?>';
            } else {
                alert(res.msg || '保存失败');
                $btn.prop('disabled', false).text('保存');
            }
        }, 'json').fail(function() {
            alert('请求失败，请重试');
            $btn.prop('disabled', false).text('保存');
        });
    });
});
</script>
