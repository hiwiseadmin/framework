<!-- 商品分类 新增/编辑 模态框片段（由 list.html 通过 {include} 引入） -->
<div class="modal fade" id="category-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="form-title">新增分类</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
            </div>
            <form id="category-form" class="modal-body row g-3">
                <input type="hidden" name="id" id="form-id" value="0">
                <div class="col-md-12">
                    <label class="form-label">上级分类</label>
                    <select name="parent_id" id="form-parent-id" class="form-select">
                        <option value="0">顶级分类</option>
                    </select>
                </div>
                <div class="col-md-12">
                    <label class="form-label">分类名称 <span class="text-danger">*</span></label>
                    <input type="text" name="name" id="form-name" class="form-control" placeholder="如：电子产品"
                           data-validation="required|maxLength:50"
                           data-validation-message-required="请填写分类名称"
                           data-validation-message-maxLength="分类名称不能超过 50 个字符">
                    <div class="invalid-feedback"><span class="validation-text"></span></div>
                </div>
                <div class="col-md-6">
                    <label class="form-label">排序</label>
                    <input type="number" name="sort_order" id="form-sort" class="form-control" value="0">
                </div>
                <div class="col-md-6">
                    <label class="form-label">状态</label>
                    <select name="status" id="form-status" class="form-select">
                        <option value="1">启用</option>
                        <option value="0">禁用</option>
                    </select>
                </div>
            </form>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">取消</button>
                <button type="submit" form="category-form" class="btn btn-primary"><i class="bi bi-check-lg"></i> 保存</button>
            </div>
        </div>
    </div>
</div>
