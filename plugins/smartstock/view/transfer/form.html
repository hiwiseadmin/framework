{extend name="__PLUGIN_VIEW__/base"}
{block name="title"}调拨单编辑{/block}
{block name="content"}
<div class="app-main container-fluid">
    {include file="__PLUGIN_VIEW__/index_header" icon="bi bi-arrow-left-right" caption="调拨管理" buttongroup="" /}
    <div class="plugin-smartstock">
        <div class="container-fluid p-0">
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title" id="form-title">{if $id > 0}编辑调拨单{else}新增调拨单{/if}</h3>
                </div>
                <div class="card-body">
                    <form id="transfer-form">
                        <input type="hidden" name="id" id="form-id" value="{$id|default=0}">

                        <div class="row g-3 mb-3">
                            <div class="col-md-4">
                                <label class="form-label">调出仓库 <span class="text-danger">*</span></label>
                                <select id="form-from-warehouse" class="form-select"><option value="">请选择仓库</option></select>
                                <div class="invalid-feedback"><span class="validation-text"></span></div>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">调入仓库 <span class="text-danger">*</span></label>
                                <select id="form-to-warehouse" class="form-select"><option value="">请选择仓库</option></select>
                                <div class="invalid-feedback"><span class="validation-text"></span></div>
                            </div>
                            <div class="col-md-2">
                                <label class="form-label">调拨日期</label>
                                <input type="date" id="form-date" class="form-control" value="{$record.order_date|default=''}">
                            </div>
                            <div class="col-md-2">
                                <label class="form-label">备注</label>
                                <input type="text" id="form-remark" class="form-control" value="{$record.remark|default=''}">
                            </div>
                        </div>

                        <!-- 明细表 -->
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <h6 class="mb-0"><i class="bi bi-list-ul me-2"></i>调拨明细</h6>
                            <button type="button" class="btn btn-outline-primary btn-sm" id="btn-add-item">
                                <i class="bi bi-plus-lg"></i> 添加明细
                            </button>
                        </div>
                        <table class="table table-bordered table-sm">
                            <thead>
                                <tr>
                                    <th width="40">#</th>
                                    <th>商品</th>
                                    <th width="100">数量</th>
                                    <th>备注</th>
                                    <th width="60">操作</th>
                                </tr>
                            </thead>
                            <tbody id="items-tbody"></tbody>
                        </table>

                        <div class="mt-3">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-lg"></i> 保存
                            </button>
                            <a href="{:url('/plugin/smartstock/transfer/index')}" class="btn btn-outline-secondary">返回</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{/block}
{block name="js"}
<script type="module">
import api from '/statics/plugins/smartstock/js/common/api.js';
import module from '/statics/plugins/smartstock/js/transfer/form.js';

        $(function() {
            module.init({id: {$id|default=0}});
        });
</script>
{/block}
