{extend name="__PLUGIN_VIEW__/base"}

{block name="title"}道具配置{/block}

{block name="content"}
<div class="app-main container-fluid">
    {include file="__PLUGIN_VIEW__/index_header" icon="bi bi-magic" caption="道具配置" buttongroup="" /}
    <div class="plugin-match3game">
        <div class="container-fluid p-0">
            <div class="card">
                <div class="card-body">
                    <form class="row g-2 mb-3" id="search-form">
                        <div class="col-md-4">
                            <input type="text" class="form-control form-control-sm" id="search-keyword" placeholder="道具编码/名称">
                        </div>
                        <div class="col-md-3">
                            <button type="submit" class="btn btn-outline-secondary btn-sm" id="btn-search"><i class="bi bi-search"></i> 搜索</button>
                            <button type="button" class="btn btn-outline-secondary btn-sm" id="btn-reset"><i class="bi bi-arrow-clockwise"></i> 重置</button>
                        </div>
                    </form>
                    <div id="toolbar" class="toolbar mb-2"></div>
                    <table id="table"></table>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="prop-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="form-title">新增道具</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="prop-form" class="modal-body row g-3">
                <input type="hidden" name="id" id="form-id" value="0">
                <div class="col-md-4">
                    <label class="form-label">道具编码 <span class="text-danger">*</span></label>
                    <input type="text" name="code" id="form-code" class="form-control" placeholder="prop.hammer" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">名称 <span class="text-danger">*</span></label>
                    <input type="text" name="name" id="form-name" class="form-control" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">类型</label>
                    <select name="kind" id="form-kind" class="form-select">
                        <option value="1">开局道具</option>
                        <option value="2">局内道具</option>
                        <option value="3">购买资源包</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">效果 JSON</label>
                    <textarea name="effect" id="form-effect" class="form-control" rows="2">{"type":"hammer"}</textarea>
                </div>
                <div class="col-md-6">
                    <label class="form-label">价格 JSON</label>
                    <textarea name="price" id="form-price" class="form-control" rows="2">{"coin":500}</textarea>
                </div>
                <div class="col-md-6">
                    <label class="form-label">广告位 ID</label>
                    <input type="text" name="ad_unit_id" id="form-ad-unit-id" class="form-control">
                </div>
                <div class="col-md-3">
                    <label class="form-label">单局上限(0=不限)</label>
                    <input type="number" name="per_battle_limit" id="form-per-battle-limit" class="form-control" value="0">
                </div>
                <div class="col-md-3">
                    <label class="form-label">状态</label>
                    <select name="status" id="form-status" class="form-select">
                        <option value="1">启用</option>
                        <option value="0">禁用</option>
                    </select>
                </div>
            </form>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">取消</button>
                <button type="submit" form="prop-form" class="btn btn-primary"><i class="bi bi-check-lg"></i> 保存</button>
            </div>
        </div>
    </div>
</div>
{/block}
