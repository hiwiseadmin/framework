{extend name="__PLUGIN_VIEW__/base"}

{block name="title"}关卡管理{/block}

{block name="content"}
<div class="app-main container-fluid">
    {include file="__PLUGIN_VIEW__/index_header" icon="bi bi-map" caption="关卡管理" buttongroup="" /}
    <div class="plugin-match3game">
        <div class="container-fluid p-0">
            <div class="card">
                <div class="card-body">
                    <form class="row g-2 mb-3" id="search-form">
                        <div class="col-md-3">
                            <input type="text" class="form-control form-control-sm" id="search-keyword" placeholder="关卡编码/名称">
                        </div>
                        <div class="col-md-3">
                            <select class="form-select form-select-sm" id="search-chapter">
                                <option value="">全部章节</option>
                                {foreach $chapters as $c}
                                <option value="{$c}">{$c}</option>
                                {/foreach}
                            </select>
                        </div>
                        <div class="col-md-2">
                            <select class="form-select form-select-sm" id="search-status">
                                <option value="">全部状态</option>
                                <option value="1">已发布</option>
                                <option value="0">草稿</option>
                                <option value="2">下架</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <button type="submit" class="btn btn-outline-secondary btn-sm" id="btn-search"><i class="bi bi-search"></i> 搜索</button>
                            <button type="button" class="btn btn-outline-secondary btn-sm" id="btn-reset"><i class="bi bi-arrow-clockwise"></i> 重置</button>
                        </div>
                    </form>

                    <div id="toolbar" class="toolbar mb-2"></div>
                    <table id="table"></table>
                </div>
            </div>
        </div>
    </div>
</div>

{include file="level/form" /}
{/block}
