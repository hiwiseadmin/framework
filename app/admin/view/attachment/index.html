{extend name="public/base" /}

{block name="title"}附件管理{/block}

{block name="css"}
<style>
.attachment-card {
transition: transform 0.2s;
cursor: pointer;
}

.attachment-card:hover {
transform: translateY(-2px);
box-shadow: var(--bs-box-shadow);
}

.attachment-thumb {
height: 120px;
display: flex;
align-items: center;
justify-content: center;
background-color: var(--bs-tertiary-bg);
overflow: hidden;
border-top-left-radius: var(--bs-card-border-radius);
border-top-right-radius: var(--bs-card-border-radius);
}

.attachment-thumb img {
max-height: 100%;
max-width: 100%;
object-fit: contain;
}

.file-icon {
font-size: 3rem;
color: var(--bs-secondary-color);
}

.selected {
border: 1px solid var(--bs-primary) !important;
}

.upload-dropzone {
border: 2px dashed var(--bs-border-color);
border-radius: var(--bs-border-radius-lg);
padding: 2rem;
text-align: center;
transition: border-color 0.3s;
background-color: var(--bs-tertiary-bg);
cursor: pointer;
}
.upload-dropzone:hover {
border-color: var(--bs-primary);
}
.upload-dropzone.dragover {
border-color: var(--bs-primary);
background-color: var(--bs-primary-bg-subtle);
}

.progress {
height: 8px;
}

.category-tree {
max-height: 400px;
overflow-y: auto;
}
</style>
{/block}

{block name="content"}
<body>
    <div class="container-fluid py-4">
        <div class="row">
            <div class="col-12">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h1 class="h3 mb-0">
                        <i class="bi bi-files me-2"></i>附件管理
                    </h1>
                    <div>
                        <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#uploadModal"><i class="bi bi-upload me-1"></i>上传文件</button>
                        <a href="/admin/attachment_category/index" class="btn btn-outline-info"><i class="bi bi-folder me-1"></i>分类管理</a>
                        <a href="/admin/attachment/trash" class="btn btn-outline-warning"><i class="bi bi-trash me-1"></i>回收站</a>
                    </div>
                </div>
            </div>
        </div>

        <!-- 筛选工具栏 -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-body">
                        <div class="row">
                            <div class="row col align-items-center">
                                <div class="col-auto">
                                    <label class="col-form-label">分类:</label>
                                </div>
                                <div class="col-auto">
                                    <select class="form-select" id="categoryFilter">
                                        <option value="0">全部分类</option>
                                    </select>
                                </div>
                                <div class="col-auto">
                                    <label class="col-form-label">关键词:</label>
                                </div>
                                <div class="col-auto">
                                    <input type="text" class="form-control" id="keywordFilter" placeholder="搜索文件名...">
                                </div>
                                <div class="col-auto">
                                    <button class="btn btn-outline-primary" id="searchBtn">
                                        <i class="bi bi-search me-1"></i>搜索
                                    </button>
                                </div>
                            </div>
                            <div class="col-auto align-items-center">
                                <div class="btn-group" role="group">
                                    <input type="radio" class="btn-check" name="viewMode" id="gridView" autocomplete="off" value="gridView" checked>
                                    <label class="btn btn-outline-primary" for="gridView"><i class="bi bi-grid-3x3-gap"></i></label>
                                    
                                    <input type="radio" class="btn-check" name="viewMode" id="listView" autocomplete="off" value="listView">
                                    <label class="btn btn-outline-primary" for="listView"><i class="bi bi-list-task"></i></label>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 批量操作工具栏 -->
        <div class="row mb-3">
            <div class="col-12">
                <div class="d-flex align-items-center" id="batchToolbar">
                    <span class="me-3" id="selectedCount">已选择 0 个文件</span>
                    <button class="btn btn-outline-primary btn-sm me-2" id="batchDownloadBtn">
                        <i class="bi bi-download me-1"></i>批量下载
                    </button>
                    <button class="btn btn-outline-danger btn-sm me-2" id="batchDeleteBtn">
                        <i class="bi bi-trash me-1"></i>批量删除
                    </button>
                    <button class="btn btn-outline-secondary btn-sm me-2" id="batchMoveBtn">
                        <i class="bi bi-folder me-1"></i>移动分类
                    </button>
                    <button class="btn btn-outline-secondary btn-sm" id="clearSelectionBtn">
                        <i class="bi bi-x-circle me-1"></i>取消选择
                    </button>
                </div>
            </div>
        </div>

        <!-- 附件列表 -->
        <div class="row" id="attachmentList">
            <!-- 附件卡片将通过JavaScript动态加载 -->
        </div>

        <!-- 分页 -->
        <div class="row mt-4">
            <div class="col-12">
                <nav id="paginationContainer">
                    <!-- 分页将通过JavaScript动态生成 -->
                </nav>
            </div>
        </div>
    </div>

    <!-- 上传模态框 -->
    <div class="modal fade" id="uploadModal" tabindex="-1" aria-labelledby="uploadModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="uploadModalLabel">上传文件</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                        <input type="file" id="fileInput" multiple style="display: none;">
                    <div class="upload-dropzone" id="uploadDropzone">
                        <div class="pe-none">
                            <i class="bi bi-cloud-upload display-4 text-muted mb-3"></i>
                            <h5>拖拽文件到此处或点击选择文件</h5>
                            <p class="text-muted">支持单个或多个文件上传</p>
                            <button class="btn btn-primary mt-2 pe-auto" id="selectFilesBtn">选择文件</button>
                        </div>
                    </div>
                    <div id="uploadProgress" class="mt-3" style="display: none;">
                        <div class="mb-2">
                            <span id="uploadStatus">准备上传...</span>
                            <span id="uploadPercent" class="float-end">0%</span>
                        </div>
                        <div class="progress">
                            <div id="uploadProgressBar" class="progress-bar" role="progressbar" style="width: 0%"></div>
                        </div>
                    </div>
                    <div id="uploadQueue" class="mt-3">
                        <!-- 上传队列将通过JavaScript动态生成 -->
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
                    <button type="button" class="btn btn-primary" id="startUploadBtn" disabled>开始上传</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 移动分类模态框 -->
    <div class="modal fade" id="moveCategoryModal" tabindex="-1" aria-labelledby="moveCategoryModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="moveCategoryModalLabel">移动分类</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="targetCategory" class="form-label">选择目标分类</label>
                        <select class="form-select" id="targetCategory">
                            <option value="0">未分类</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" id="confirmMoveBtn">确认移动</button>
                </div>
            </div>
        </div>
    </div>

{/block}
