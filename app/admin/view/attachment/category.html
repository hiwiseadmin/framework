{extend name="public/base" /}

{block name="title"}分类管理{/block}

{block name="css"}
<style>
.category-tree {
    max-height: 500px;
    overflow-y: auto;
}

.tree-item {
    padding: 8px 12px;
    border: 1px solid var(--bs-border-color);
    margin-bottom: 5px;
    border-radius: var(--bs-border-radius);
    cursor: pointer;
    transition: all 0.2s;
}

.tree-item:hover {
    background-color: var(--bs-tertiary-bg);
}

.tree-item.selected {
    border-color: var(--bs-primary);
    background-color: var(--bs-primary-bg-subtle);
}

.tree-children {
    margin-left: 30px;
}

.drag-over {
    background-color: var(--bs-warning-bg-subtle);
    border-color: var(--bs-warning-border-subtle);
}
</style>
{/block}

{block name="content"}
<body>
    <div class="container-fluid py-4">
        <div class="row">
            <div class="col-12">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h1 class="h3 mb-0">
                        <i class="bi bi-folder me-2"></i>分类管理
                    </h1>
                    <div>
                        <a href="/admin/attachment/index" class="btn btn-outline-secondary me-2">
                            <i class="bi bi-arrow-left me-1"></i>返回附件管理
                        </a>
                        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#categoryModal" id="addCategoryBtn">
                            <i class="bi bi-plus-circle me-1"></i>添加分类
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h5 class="card-title mb-0">分类列表</h5>
                    </div>
                    <div class="card-body">
                        <div id="categoryTree" class="category-tree">
                            <!-- 分类树将通过JavaScript动态生成 -->
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header">
                        <h5 class="card-title mb-0">分类信息</h5>
                    </div>
                    <div class="card-body">
                        <div id="categoryInfo" style="display: none;">
                            <h6 id="infoName" class="border-bottom pb-2"></h6>
                            <div class="mb-2">
                                <small class="text-muted">ID:</small>
                                <span id="infoId" class="ms-2"></span>
                            </div>
                            <div class="mb-2">
                                <small class="text-muted">父级分类:</small>
                                <span id="infoParent" class="ms-2"></span>
                            </div>
                            <div class="mb-2">
                                <small class="text-muted">排序:</small>
                                <span id="infoSort" class="ms-2"></span>
                            </div>
                            <div class="mb-3">
                                <small class="text-muted">创建时间:</small>
                                <span id="infoCreateTime" class="ms-2"></span>
                            </div>
                            <div class="d-grid gap-2">
                                <button class="btn btn-outline-primary btn-sm" id="editCategoryBtn">
                                    <i class="bi bi-pencil me-1"></i>编辑
                                </button>
                                <button class="btn btn-outline-danger btn-sm" id="deleteCategoryBtn">
                                    <i class="bi bi-trash me-1"></i>删除
                                </button>
                            </div>
                        </div>
                        <div id="noCategoryInfo" class="text-center text-muted py-4">
                            <i class="bi bi-info-circle display-6"></i>
                            <p class="mt-2">请选择一个分类查看详情</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 分类编辑模态框 -->
    <div class="modal fade" id="categoryModal" tabindex="-1" aria-labelledby="categoryModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="categoryModalLabel">添加分类</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="categoryForm">
                        <input type="hidden" id="categoryId" name="id">
                        <div class="mb-3">
                            <label for="categoryName" class="form-label">分类名称</label>
                            <input type="text" class="form-control" id="categoryName" name="name" required>
                        </div>
                        <div class="mb-3">
                            <label for="parentCategory" class="form-label">父级分类</label>
                            <select class="form-select" id="parentCategory" name="parent_id">
                                <option value="0">无父级分类</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="categorySort" class="form-label">排序</label>
                            <input type="number" class="form-control" id="categorySort" name="sort" value="0" min="0">
                            <div class="form-text">数字越小越靠前</div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" id="saveCategoryBtn">保存</button>
                </div>
            </div>
        </div>
    </div>
{/block}
