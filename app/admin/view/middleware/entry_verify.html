<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>404</title>
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <style>
    body {margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f5f6f8;color:#333;min-height:100vh;display:flex;align-items:center;justify-content:center;-webkit-text-size-adjust:100%;}
    .box {text-align:center;padding:20px;}
    .box h1 {font-size:4rem;margin:0 0 16px;color:#bbb;font-weight:300;letter-spacing:4px;}
    .box p {font-size:1rem;color:#888;margin:0;line-height:1.6;}
    @media (max-width:480px) { .box h1 {font-size:3rem;} }
    </style>
</head>
<body>
    <div class="box">
        <h1>404</h1>
        <p>您访问的页面不存在或已被移动。</p>
    </div>
</body>
</html>
