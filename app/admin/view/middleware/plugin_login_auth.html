<!DOCTYPE html>
<html>
<head>
    <title>未登录提醒</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <style> 
    body {font-family:'Gill Sans','Gill Sans MT',Calibri,'Trebuchet MS',sans-serif;font-size:18px;background:linear-gradient(45deg,black,transparent);height:100vh;display:flex;justify-content:center;overflow:hidden;background:linear-gradient(300deg,#d9afd9 0%,#97d9e1 50%,#93aff2 100%);padding:20px 50px;margin:0;-webkit-text-size-adjust:100%;}
    .container {width:100%;max-width:860px;margin-top:40px;padding:20px;box-sizing:border-box;}
    h1 {font-size:2.2rem;margin-top:0;margin-bottom:20px;}
    .content {padding:25px 0;margin-top:20px;}
    p {line-height:1.6;margin-bottom:20px;}
    code {background-color:var(--bs-secondary-bg);padding:4px 10px;font-size:18px;font-weight:700;font-family:'Courier New',Courier,monospace;border-radius:5px;display:inline-block;word-break:break-all;max-width:100%;box-sizing:border-box;}
    .warning {color:var(--bs-danger);background-color:var(--bs-danger-bg-subtle);padding:15px;border-radius:8px;border-left:4px solid var(--bs-danger);font-weight:bold;}
    @media (max-width:768px) {
    body {padding:15px 20px;font-size:16px;overflow-y:auto;height:auto;min-height:100vh;}
    .container {padding:10px 0;}
    h1 {font-size:1.8rem;margin-bottom:15px;}
    .content {padding:20px 0;margin-top:10px;}
    code {font-size:16px;padding:3px 8px;}
    .warning {padding:12px;}
    }
    @media (max-width:480px) {
    body {padding:10px 15px;font-size:15px;}
    h1 {font-size:1.6rem;}
    .content {padding:15px 0;}
    code {font-size:15px;padding:2px 6px;}
    p {margin-bottom:15px;}
    }
    </style>
</head>
<body>
    <div class="container">
        <h1>需要登录访问</h1>
        <div class="content">
            <p>此页面需要登录才能访问。您当前未登录或会话已过期，请登录后重试。</p>
        </div>
    </div>
</body>
</html>
