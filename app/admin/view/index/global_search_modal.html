<!-- 全局搜索模态框 -->
<div class="modal fade" id="globalSearchModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content shadow-lg">
            <div class="modal-header py-2 px-0 border-0">
                <div class="input-group border-0 px-3">
                    <span class="input-group-text bg-transparent border-0 pe-1">
                        <i class="bi bi-search text-secondary"></i>
                    </span>
                    <input type="text" class="form-control border-0 shadow-none fs-5 fw-normal mx-2" 
                           id="global-search-input" 
                           placeholder="搜索菜单、配置、功能..." 
                           autocomplete="off">
                    <span class="input-group-text bg-transparent border-0 ps-1">
                        <kbd class="text-bg-secondary rounded px-1 small">ESC</kbd>
                    </span>
                </div>
            </div>
            <div class="modal-body p-0 mx-2" id="global-search-results" style="max-height: 420px; overflow-y: auto; min-height: 60px;">
                <div class="text-center py-3 text-muted small">输入关键词开始搜索...</div>
            </div>
            <div class="modal-footer py-1 px-3 justify-content-between border-top-0">
                <small class="text-muted">
                    <kbd class="text-bg-secondary rounded px-1 small">↑↓</kbd> 导航
                    <kbd class="text-bg-secondary rounded px-1 small ms-1">Enter</kbd> 打开
                    <kbd class="text-bg-secondary rounded px-1 small ms-1">ESC</kbd> 关闭
                </small>
                <small class="text-muted" id="search-result-count"></small>
            </div>
        </div>
    </div>
</div>
