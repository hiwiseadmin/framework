{extend name="public/base" /}

{block name="title"}变更记录{/block}

{block name="css"}
<style>
    .diff-view { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; border: 1px solid #dee2e6; border-radius: .25rem; max-height: 40vh; overflow: auto; }
    .diff-row { display: flex; line-height: 1.5; white-space: pre-wrap; word-break: break-all; }
    .diff-no { flex: 0 0 46px; text-align: right; padding: 0 6px; color: #adb5bd; background: #f8f9fa; border-right: 1px solid #eee; user-select: none; }
    .diff-code { flex: 1 1 auto; padding: 0 8px; }
    .diff-del { background: #ffe6e6; }
    .diff-ins { background: #e6ffe6; }
    .diff-skip { background: #f8f9fa; color: #6c757d; padding: 0 8px; }
    .cl-timeline { list-style: none; margin: 0; padding: 0; }
    .cl-timeline > li { border-left: 2px solid #dee2e6; padding: 0 0 18px 16px; position: relative; }
    .cl-timeline > li::before { content: ''; position: absolute; left: -6px; top: 4px; width: 10px; height: 10px; border-radius: 50%; background: #adb5bd; }
    .cl-timeline > li.is-rollback::before { background: #dc3545; }
    .cl-change-old { background: #fff5f5; text-decoration: line-through; color: #b02a37; }
    .cl-change-new { background: #f0fff4; color: #146c43; }
    .cl-value { white-space: pre-wrap; word-break: break-all; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
</style>
{/block}

{block name="content"}
<div class="app-main container-fluid">
    {include file="public/page_header" icon="bi bi-clock-history" title="变更记录" desc="按记录查看字段级变更（旧值 → 新值），支持回滚到某次变更之前；敏感字段不落库" actions="" /}

    <form id="ws-filter" class="ws-filter-bar ws-filter-form row g-2 align-items-end mb-3">
        <div class="col-auto">
            <label class="form-label" for="filter-model">模型</label>
            <select class="form-select form-select-sm" id="filter-model" name="model">
                <option value="">加载中…</option>
            </select>
        </div>
        <div class="col-auto">
            <label class="form-label" for="filter-pk">记录ID</label>
            <input type="text" class="form-control form-control-sm" id="filter-pk" name="pk_value" placeholder="主键值">
        </div>
        <div class="col-auto">
            <label class="form-label" for="filter-operator">操作人</label>
            <input type="text" class="form-control form-control-sm" id="filter-operator" name="operator" placeholder="用户名">
        </div>
        <div class="col-auto">
            <label class="form-label" for="filter-field">字段</label>
            <input type="text" class="form-control form-control-sm" id="filter-field" name="field" placeholder="字段名">
        </div>
        <div class="col-auto">
            <button type="button" class="btn btn-sm btn-primary ws-filter-submit">查询</button>
            <button type="button" class="btn btn-sm btn-outline-secondary ws-filter-reset">重置</button>
        </div>
    </form>

    <div id="toolbar" class="ws-toolbar"></div>
    <table id="table"></table>

    <div id="timeline-panel" class="card mt-3 d-none">
        <div class="card-header d-flex justify-content-between align-items-center">
            <span id="timeline-title">变更时间线</span>
            <button type="button" class="btn btn-sm btn-outline-secondary" id="timeline-close">关闭</button>
        </div>
        <div class="card-body">
            <div id="timeline-body" class="text-muted">加载中…</div>
        </div>
    </div>
</div>
{/block}
