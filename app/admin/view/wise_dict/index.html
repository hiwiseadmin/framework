{extend name="public/base" /}

{block name="title"}数据字典管理{/block}

{block name="css"}
<style>
.wise-dict-split {
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 1rem;
    min-height: 500px;
}
.wise-dict-left {
    background: var(--bs-tertiary-bg);
    border-radius: 0.75rem;
    overflow: hidden;
    display: flex;
    flex-direction: column;
}
.wise-dict-left-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.85rem 1rem;
    border-bottom: 1px solid var(--bs-border-color);
    font-weight: 600;
    font-size: 0.85rem;
}
.wise-dict-left-search {
    padding: 0.5rem 0.75rem;
    border-bottom: 1px solid var(--bs-border-color-translucent);
}
.wise-dict-left-search input {
    width: 100%;
    border-radius: 999px;
    font-size: 0.8rem;
    padding: 0.35rem 0.75rem;
}
.wise-dict-left-list {
    flex: 1;
    overflow-y: auto;
}
.wise-dict-left-list .list-group-item {
    border: none;
    border-bottom: 1px solid var(--bs-border-color-translucent);
    cursor: pointer;
    transition: background 0.12s;
    border-radius: 0;
    padding: 0.65rem 1rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.85rem;
}
.wise-dict-left-list .list-group-item:hover { background: var(--bs-secondary-bg); }
.wise-dict-left-list .list-group-item.active {
    background: var(--bs-primary-bg-subtle);
    color: var(--bs-primary-text);
    border-left: 3px solid var(--bs-primary);
}
.wise-dict-left-list .list-group-item .tree-icon { font-size: 0.7rem; color: var(--bs-success); }
.wise-dict-left-list .list-group-item .type-actions {
    display: flex;
    gap: 0.15rem;
    opacity: 0;
    transition: opacity 0.15s;
}
.wise-dict-left-list .list-group-item:hover .type-actions { opacity: 1; }
.wise-dict-left-list .list-group-item .type-actions button {
    width: 24px;
    height: 24px;
    padding: 0;
    border: none;
    background: transparent;
    border-radius: 0.25rem;
    cursor: pointer;
    font-size: 0.7rem;
    transition: all 0.12s;
}
.wise-dict-left-list .list-group-item .type-actions .btn-type-delete:hover { background: rgba(239,68,68,0.1); color: var(--bs-danger); }
.wise-dict-left-list .list-group-item .type-actions .btn-type-toggle:hover { background: rgba(245,158,11,0.1); color: var(--bs-warning); }
.wise-dict-left-list .list-group-item .item-count {
    font-size: 0.65rem;
    padding: 0.05rem 0.35rem;
    border-radius: 999px;
    background: var(--bs-secondary-bg);
    color: var(--bs-secondary-color);
}

.wise-dict-right {
    background: var(--bs-tertiary-bg);
    border-radius: 0.75rem;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}
.wise-dict-right-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.85rem 1.25rem;
    border-bottom: 1px solid var(--bs-border-color);
}
.wise-dict-right-header .dict-info { font-size: 0.9rem; }
.wise-dict-right-header .dict-info strong { margin-right: 0.5rem; }
.wise-dict-right-header .dict-info code { font-size: 0.75rem; background: var(--bs-secondary-bg); padding: 0.1rem 0.4rem; border-radius: 0.25rem; }
.wise-dict-right-body {
    flex: 1;
    overflow-y: auto;
    padding: 0.5rem 0;
}
.wise-dict-right-empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--bs-secondary-color);
    font-size: 0.9rem;
}
.wise-dict-right-footer {
    background: var(--bs-tertiary-bg);
    font-size: 0.8rem;
}

/* 字典项行 */
.wise-di-row {
    display: grid;
    grid-template-columns: 60px 130px 1fr 70px 60px 100px;
    gap: 0.5rem;
    align-items: center;
    padding: 0.5rem 1.25rem;
    border-bottom: 1px solid var(--bs-border-color-translucent);
    font-size: 0.85rem;
    transition: background 0.1s;
}
.wise-di-row:hover { background: var(--bs-secondary-bg); }
.wise-di-row .di-actions {
    display: flex;
    gap: 0.15rem;
    opacity: 0;
    transition: opacity 0.15s;
}
.wise-di-row:hover .di-actions { opacity: 1; }
.wise-di-row .di-actions button {
    width: 26px;
    height: 26px;
    padding: 0;
    border: none;
    background: transparent;
    border-radius: 0.3rem;
    cursor: pointer;
    font-size: 0.8rem;
    transition: all 0.12s;
}
.wise-di-row .di-actions .btn-edit:hover { background: rgba(245,158,11,0.1); color: var(--bs-warning); }
.wise-di-row .di-actions .btn-del:hover  { background: rgba(239,68,68,0.1);  color: var(--bs-danger); }
.wise-di-head {
    background: var(--bs-secondary-bg);
    font-weight: 600;
    color: var(--bs-secondary-color);
    border-bottom: 1px solid var(--bs-border-color);
    position: sticky;
    top: 0;
    z-index: 1;
}
.wise-di-head:hover { background: var(--bs-secondary-bg); }

@media (max-width: 767px) {
    .wise-dict-split { grid-template-columns: 1fr; }
    .wise-dict-left { max-height: 280px; }
    .wise-dict-right { min-height: 350px; }
    .wise-di-row { grid-template-columns: 50px 1fr 60px 80px; }
    .wise-di-row > *:nth-child(2),
    .wise-di-row > *:nth-child(5) { display: none; }
}
</style>
{/block}

{block name="content"}
<body>
<div class="app-main container-fluid">
    <div class="d-flex justify-content-between align-items-start mb-3">
        <div>
            <h4 class="mb-1">数据字典管理</h4>
            <p class="text-secondary mb-0 small">管理系统中的字典类型和字典项，支持树形结构和缓存加速。</p>
        </div>
        <button type="button" class="btn btn-outline-secondary btn-sm" id="btnRefreshDictCache" title="清除字典缓存">
            <i class="bi bi-arrow-repeat"></i> 刷新缓存
        </button>
    </div>

    <div class="wise-dict-split">
        <!-- 左侧：字典类型 -->
        <div class="wise-dict-left">
            <div class="wise-dict-left-header">
                <span>字典类型</span>
                <button type="button" class="btn btn-outline-primary btn-sm" id="btnAddDictType">
                    <i class="bi bi-plus"></i>
                </button>
            </div>
            <div class="wise-dict-left-search">
                <input type="text" class="form-control form-control-sm" id="dictTypeSearch" placeholder="搜索字典类型...">
            </div>
            <div class="wise-dict-left-list" id="dictTypeList">
                <div class="text-center py-4 text-secondary small">
                    <i class="bi bi-inbox d-block mb-2" style="font-size:1.5rem"></i>
                    加载中...
                </div>
            </div>
        </div>

        <!-- 右侧：字典项 -->
        <div class="wise-dict-right">
            <div class="wise-dict-right-header" id="dictItemHeader">
                <div class="dict-info">
                    <strong id="dictRightName">-</strong>
                    <code id="dictRightCode">-</code>
                </div>
                <div class="btn-group btn-group-sm d-none" id="dictItemToolbar">
                    <button type="button" class="btn btn-outline-primary" id="btnAddDictItem"><i class="bi bi-plus"></i> 新增</button>
                    <button type="button" class="btn btn-outline-success" id="btnBatchEnable"><i class="bi bi-check-circle"></i> 批量启用</button>
                    <button type="button" class="btn btn-outline-secondary" id="btnBatchDisable"><i class="bi bi-slash-circle"></i> 批量禁用</button>
                    <button type="button" class="btn btn-outline-danger" id="btnBatchDeleteItem"><i class="bi bi-trash"></i> 批量删除</button>
                </div>
            </div>
            <div class="wise-dict-right-body" id="dictItemBody">
                <div class="wise-dict-right-empty">
                    <i class="bi bi-arrow-left-circle" style="font-size:2rem;margin-bottom:0.5rem"></i>
                    请选择左侧字典类型
                </div>
            </div>
            <!-- 分页 -->
            <div class="wise-dict-right-footer d-none p-2 border-top" id="dictItemPager"></div>
        </div>
    </div>
</div>

<!-- 字典类型模态框 -->
<div class="modal fade" id="dictTypeModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">字典类型</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="dictTypeForm">
            <div class="modal-body">
                <input type="hidden" name="dict_code_orig" id="dtOrig">
                <div class="mb-3">
                    <label class="form-label">字典编码 <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" name="dict_code" id="dtCode" required>
                    <div class="form-text small">创建后不可修改</div>
                </div>
                <div class="mb-3">
                    <label class="form-label">名称 <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" name="name" id="dtName" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">描述</label>
                    <textarea class="form-control" name="description" id="dtDesc" rows="2"></textarea>
                </div>
                <div class="form-check form-switch mb-2">
                    <input class="form-check-input" type="checkbox" name="is_tree" id="dtIsTree" value="1">
                    <label class="form-check-label" for="dtIsTree">树形字典</label>
                </div>
                <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" name="status" id="dtStatus" value="1" checked>
                    <label class="form-check-label" for="dtStatus">启用</label>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="submit" class="btn btn-primary">保存</button>
            </div>
            </form>
        </div>
    </div>
</div>

<!-- 字典项模态框 -->
<div class="modal fade" id="dictItemModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">字典项</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="dictItemForm">
            <div class="modal-body">
                <input type="hidden" name="id" id="diId">
                <input type="hidden" name="dict_code" id="diDictCode">
                <div class="mb-3">
                    <label class="form-label">项值 <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" name="item_value" id="diValue" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">显示标签 <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" name="item_label" id="diLabel" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">父级</label>
                    <select class="form-select" name="parent_id" id="diParent">
                        <option value="0">顶级</option>
                    </select>
                </div>
                <div class="row g-2">
                    <div class="col-6">
                        <label class="form-label">排序</label>
                        <input type="number" class="form-control" name="sort" id="diSort" value="0">
                    </div>
                    <div class="col-6">
                        <label class="form-label">状态</label>
                        <select class="form-select" name="status" id="diStatus">
                            <option value="1">启用</option>
                            <option value="0">禁用</option>
                        </select>
                    </div>
                </div>
                <div class="mb-3 mt-3">
                    <label class="form-label">备注</label>
                    <textarea class="form-control" name="remark" id="diRemark" rows="2"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="submit" class="btn btn-primary">保存</button>
            </div>
            </form>
        </div>
    </div>
</div>
{/block}

{block name="js"}
