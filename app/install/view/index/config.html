{extend name="index/layout" /}

{block name="script"}
<script>
$(document).ready(function() {
    $('.btn-install').click(function(e) {
        e.preventDefault();
        window.location.href = "{:url('/install/index/install')}";
    });

    // 密码强度检查
    function updatePasswordStrength(password) {
        const strength = checkPasswordStrength(password);
        const bar = $('#passwordStrength .strength-bar');
        let text = '';
        let className = '';
        
        bar.removeClass('strength-weak strength-fair strength-good strength-strong');
        
        if (password.length === 0) {
            bar.css('width', '0%');
            $('#passwordStrengthText').text('');
            return;
        }
        
        if (strength <= 2) {
            bar.css('width', '25%');
            bar.addClass('strength-weak');
            text = '弱';
        } else if (strength === 3) {
            bar.css('width', '50%');
            bar.addClass('strength-fair');
            text = '一般';
        } else if (strength === 4) {
            bar.css('width', '75%');
            bar.addClass('strength-good');
            text = '良好';
        } else {
            bar.css('width', '100%');
            bar.addClass('strength-strong');
            text = '强';
        }
        
        $('#passwordStrengthText').text('密码强度: ' + text);
    }
    
    // 生成随机密码
    $('#generatePassword').click(function() {
        const chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*';
        let password = '';
        for (let i = 0; i < 12; i++) {
            password += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        
        $('#admin_password').val(password);
        $('#admin_password_confirm').val(password);
        updatePasswordStrength(password);
    });
    
    // 实时检查密码强度
    $('#admin_password').on('input', function() {
        updatePasswordStrength($(this).val());
    });
    
    // 测试数据库连接
    $('#testConnection').click(function() {
        const btn = $(this);
        showLoading(btn);
        
        // 收集表单数据
        const formData = {
            hostname: $('#hostname').val(),
            database: $('#database').val(),
            username: $('#username').val(),
            password: $('#db_password').val(),
            hostport: $('#hostport').val(),
            prefix: $('#prefix').val()
        };
        
        $.ajax({
            url: "{:url('/install/index/config')}",
            type: 'POST',
            data: formData,
            success: function(response) {
                hideLoading(btn, '<i class="bi bi-plug"></i> 测试连接');
                
                if (response.code === 1) {
                    const alertClass = response.data.database_exists ? 'alert-warning' : 'alert-success';
                    const icon = response.data.database_exists ? 'bi-exclamation-triangle' : 'bi-check-circle';
                    const message = response.data.message + (response.data.database_version ? 
                        ' (MySQL版本: ' + response.data.database_version + ')' : '');
                    
                    $('#testResult').html(`
                        <div class="alert alert-custom ${alertClass}">
                            <i class="bi ${icon} me-2"></i>
                            ${message}
                        </div>
                    `);
                    
                    // 保存表单数据到本地存储
                    localStorage.setItem('install_config', JSON.stringify($('#configForm').serializeArray()));
                } else {
                    showAlert(response.msg || '连接失败', 'danger');
                }
            },
            error: function(xhr) {
                hideLoading(btn, '<i class="bi bi-plug"></i> 测试连接');
                showAlert('请求失败: ' + xhr.statusText, 'danger');
            }
        });
    });
    
    // 表单提交验证
    $('#configForm').submit(function(e) {
        e.preventDefault();
        e.stopPropagation();
        
        const btn = $('.btn-install');
        showLoading(btn);
        
        const formData = $(this).serialize();
        
        $.ajax({
            url: "{:url('/install/index/config')}",
            type: 'POST',
            data: formData,
            success: function(response) {
                if (response.code === 1) {
                    // 保存配置并跳转
                    localStorage.setItem('install_config', formData);
                    window.location.href = "{:url('/install/index/install')}";
                } else {
                    hideLoading(btn, '下一步 <i class="bi bi-arrow-right"></i>');
                    showAlert(response.msg, 'danger');
                }
            },
            error: function(xhr) {
                hideLoading(btn, '下一步 <i class="bi bi-arrow-right"></i>');
                showAlert('请求失败: ' + xhr.statusText, 'danger');
            }
        });
    });
    
    // 从本地存储恢复数据
    const savedConfig = localStorage.getItem('install_config');
    if (savedConfig) {
        const params = new URLSearchParams(savedConfig);
        params.forEach((value, key) => {
            $(`[name="${key}"]`).val(value);
        });
    }
    
    // 设置默认值
    {if isset($defaults)}
    {volist name="defaults" id="value" key="key"}
    {if !$value}continue;{/if}
    if (!$('#{$key}').val()) {
        $('#{$key}').val('{$value}');
    }
    {/volist}
    {/if}
});
</script>
{/block}

{block name="content"}
<div class="row">
    <div class="col-12">
        <h3 class="mb-4">数据库配置</h3>
        
        <form id="configForm">
            <div class="row">
                <div class="col-md-6">
                    <div class="card border-0 shadow-sm mb-4">
                        <div class="card-header bg-white border-0">
                            <h5 class="mb-0"><i class="bi bi-database me-2"></i>数据库设置</h5>
                        </div>
                        <div class="card-body">
                            <div class="form-group">
                                <label class="form-label" for="hostname">数据库主机</label>
                                <input type="text" class="form-control" id="hostname" name="hostname" required
                                       placeholder="通常为 localhost 或 127.0.0.1">
                                <small class="form-text text-muted">数据库服务器地址</small>
                            </div>
                            
                            <div class="form-group">
                                <label class="form-label" for="hostport">数据库端口</label>
                                <input type="number" class="form-control" id="hostport" name="hostport" 
                                       value="3306" required>
                            </div>
                            
                            <div class="form-group">
                                <label class="form-label" for="database">数据库名</label>
                                <input type="text" class="form-control" id="database" name="database" required
                                       placeholder="数据库不存在时将自动创建">
                            </div>
                            
                            <div class="form-group">
                                <label class="form-label" for="username">用户名</label>
                                <input type="text" class="form-control" id="username" name="username" required>
                            </div>
                            
                            <div class="form-group">
                                <label class="form-label" for="db_password">密码</label>
                                <input type="password" class="form-control" id="db_password" name="password"
                                       placeholder="数据库用户密码">
                            </div>
                            
                            <div class="form-group">
                                <label class="form-label" for="prefix">数据表前缀</label>
                                <input type="text" class="form-control" id="prefix" name="prefix" 
                                       placeholder="ws_" value="ws_">
                                <small class="form-text text-muted">用于区分同一数据库中的多个应用</small>
                            </div>
                            
                            <div class="mb-3">
                                <button type="button" id="testConnection" class="btn btn-outline-primary">
                                    <i class="bi bi-plug"></i> 测试连接
                                </button>
                            </div>
                            
                            <div id="testResult"></div>
                        </div>
                    </div>
                </div>
                
                <div class="col-md-6">
                    <div class="card border-0 shadow-sm mb-4">
                        <div class="card-header bg-white border-0">
                            <h5 class="mb-0"><i class="bi bi-person-badge me-2"></i>管理员设置</h5>
                        </div>
                        <div class="card-body">
                            <div class="form-group">
                                <label class="form-label" for="admin_username">管理员账号</label>
                                <input type="text" class="form-control" id="admin_username" name="admin_username" required
                                       placeholder="登录后台使用的用户名">
                            </div>
                            
                            <div class="form-group">
                                <label class="form-label" for="admin_password">管理员密码</label>
                                <div class="input-group">
                                    <input type="password" class="form-control" id="admin_password" 
                                           name="admin_password" required>
                                    <button type="button" class="btn btn-outline-secondary" id="generatePassword">
                                        <i class="bi bi-shuffle"></i>
                                    </button>
                                </div>
                                <div class="password-strength mt-2">
                                    <div class="strength-bar" id="passwordStrength">
                                        <div class="strength-bar"></div>
                                    </div>
                                </div>
                                <small class="form-text" id="passwordStrengthText"></small>
                            </div>
                            
                            <div class="form-group">
                                <label class="form-label" for="admin_password_confirm">确认密码</label>
                                <input type="password" class="form-control" id="admin_password_confirm" 
                                       name="admin_password_confirm" required>
                            </div>
                            
                            <div class="form-group">
                                <label class="form-label" for="admin_email">管理员邮箱</label>
                                <input type="email" class="form-control" id="admin_email" name="admin_email" required>
                            </div>
                        </div>
                    </div>
                    
                    <div class="card border-0 shadow-sm">
                        <div class="card-header bg-white border-0">
                            <h5 class="mb-0"><i class="bi bi-globe me-2"></i>站点设置</h5>
                        </div>
                        <div class="card-body">
                            <div class="form-group">
                                <label class="form-label" for="site_name">站点名称</label>
                                <input type="text" class="form-control" id="site_name" name="site_name" required
                                       placeholder="您的网站名称">
                            </div>
                            
                            <div class="alert alert-info alert-custom mt-3">
                                <i class="bi bi-lightbulb me-2"></i>
                                <strong>建议：</strong>
                                <ul class="mb-0 mt-2">
                                    <li>使用强密码，包含大小写字母、数字和特殊字符</li>
                                    <li>建议使用专用数据库用户，不要使用root账号</li>
                                    <li>请确保数据库版本为 MySQL 5.7 或更高</li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="row mt-4">
                <div class="col-12">
                    <div class="alert alert-warning alert-custom">
                        <i class="bi bi-exclamation-triangle me-2"></i>
                        <strong>重要提示：</strong> 请确保数据库连接信息正确，安装过程将会创建数据表并初始化数据，已有数据将被覆盖！
                    </div>
                </div>
            </div>
        </form>
    </div> 
</div>
{/block}
